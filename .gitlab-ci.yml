# Turn the tag into a real GitHub Release so the GitHub release workflow fires.
# A mirrored tag is only a ref; the Release object is what gradle-publish.yml keys on.
github-release:
  image: alpine:latest
  stage: package
  only:
    - tags
  variables:
    GITHUB_REPO: tcncloud/sati
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -e
      : "${ORG_GITHUB_TOKEN:?need a GitHub token with contents:write}"
      API="https://api.github.com/repos/${GITHUB_REPO}"
      AUTH="Authorization: Bearer ${ORG_GITHUB_TOKEN}"

      # Wait for push-mirroring to land the tag on GitHub; POSTing before it exists
      # would create a bogus tag at the default branch head.
      for i in $(seq 1 30); do
        if curl -sS -f -H "$AUTH" "$API/git/ref/tags/$CI_COMMIT_TAG" >/dev/null 2>&1; then
          found=1; break
        fi
        echo "waiting for mirror to push $CI_COMMIT_TAG ($i/30)"; sleep 10
      done
      [ "${found:-}" = 1 ] || { echo "tag never reached GitHub — is push mirroring on?"; exit 1; }

      # Idempotent: a manual (or re-run) release must not fail the job.
      if curl -sS -f -H "$AUTH" "$API/releases/tags/$CI_COMMIT_TAG" >/dev/null 2>&1; then
        echo "release already exists for $CI_COMMIT_TAG"; exit 0
      fi

      prerelease=false
      case "$CI_COMMIT_TAG" in *-*) prerelease=true;; esac   # e.g. v3.0.0-beta3

      curl -sS -f -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
        "$API/releases" \
        -d "{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"$CI_COMMIT_TAG\",\"prerelease\":$prerelease,\"generate_release_notes\":true}"
      echo "created GitHub release $CI_COMMIT_TAG (prerelease=$prerelease)"
